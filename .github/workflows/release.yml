name: Release

# Tag-driven: push a v* tag and this builds the sidecar, packages the renderer
# into an Electron installer, and attaches both to a GitHub prerelease.
#
# There is no automatic versioning here on purpose. A release is a decision, and
# the tag is that decision made explicit.
#
# Release notes live in docs/releases/<tag>.md and are passed to gh with
# --notes-file. Installer names follow the update metadata exactly. Assets are
# uploaded to a draft and verified before publication; existing releases cannot
# be overwritten by a retry.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      # Refuse to publish a version the source does not agree with. The tag, the
      # Directory.Build.props Version and electron/package.json version have all
      # drifted apart before, and a release that reports the wrong version is
      # worse than no release.
      #
      # The tag comes from the ref on a push and from the dispatch input on a
      # manual run, because `ref_name` is "main" in that case. It is then emitted
      # as a job output so the publish step cannot disagree with this check about
      # which tag is being released.
      - name: Resolve and verify the tag
        id: tag
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $fromRef = $env:RELEASE_REF
          if ($fromRef -like 'refs/tags/*') {
            $tag = $fromRef.Substring('refs/tags/'.Length)
          }
          else {
            $tag = $env:INPUT_TAG
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Error 'No tag given: neither the ref nor the dispatch input carried one.'
            exit 1
          }
          if (-not $tag.StartsWith('v')) {
            $tag = "v$tag"
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw 'The release tag must be a version such as v0.3.1-alpha.'
          }
          $sha = git rev-parse --verify "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "The tag '$tag' does not exist." }
          git checkout --detach $sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out the release commit.' }
          $expected = $tag.Substring(1)

          [xml]$props = Get-Content Directory.Build.props
          $dotnetVersion = ($props.Project.PropertyGroup.Version | Where-Object { $_ })

          $package = Get-Content electron/package.json -Raw | ConvertFrom-Json
          $npmVersion = $package.version

          Write-Host "tag             : $tag"
          Write-Host "Directory.Build : $dotnetVersion"
          Write-Host "package.json    : $npmVersion"

          if ($dotnetVersion -ne $expected) {
            Write-Error "Directory.Build.props says '$dotnetVersion' but the tag is '$expected'."
            exit 1
          }
          if ($npmVersion -ne $expected) {
            Write-Error "electron/package.json says '$npmVersion' but the tag is '$expected'."
            exit 1
          }

          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) {
            Write-Error "$notes is missing. Write the release notes before tagging."
            exit 1
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

          # Explicit so a clean run does not inherit the exit code of the last
          # native command, which would be 1 from a Test-Path that found nothing.
          exit 0

      - name: Verify the required release documents exist
        run: |
          $required = @('LICENSE','PRIVACY.md','SECURITY.md','CHANGELOG.md','CONTRIBUTING.md')
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Missing: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required documents present."
          exit 0

      - name: Refuse to overwrite an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify existing releases.' }
          if ($tags -contains $env:RELEASE_TAG) {
            throw "Release $env:RELEASE_TAG already exists. Publish a new version instead of replacing installed update metadata."
          }

      - name: Verify build and tests before packaging
        run: |
          dotnet restore AIClient.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build AIClient.slnx --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test AIClient.slnx --no-build

      - name: Publish the sidecar
        run: >
          dotnet publish src/AIClient.Server
          -c Release
          -r win-x64
          --self-contained true
          -o electron/sidecar

      - name: Install renderer dependencies
        working-directory: electron
        run: npm ci
      - name: Smoke test the published sidecar
        # The published apphost must boot with its embedded runtime and a fresh profile.
        run: ./scripts/smoke-sidecar.ps1

      - name: Build renderer
        working-directory: electron
        run: npm run build:renderer
      - name: Typecheck renderer and Electron shell
        working-directory: electron
        run: npm run typecheck:all
      - name: Test renderer and shell boundaries
        working-directory: electron
        run: npm test
      - name: Test release asset validation
        run: node --test scripts/collect-release-assets.test.cjs

      # electron-builder picks the sidecar up through extraResources, so it has
      # to be a single directory beside the manifest. Verified here rather than
      # discovered by a user whose installer starts to a window that never loads
      # data.
      - name: Verify the sidecar output
        run: |
          if (-not (Test-Path electron/sidecar/AIClient.Server.exe)) {
            Write-Error 'electron/sidecar/AIClient.Server.exe is missing; the installer would ship without a backend.'
            exit 1
          }
          Get-ChildItem electron/sidecar | Select-Object Name, Length
          exit 0

      - name: Package the installer
        working-directory: electron
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artefacts
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.tag.outputs.sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node scripts/collect-release-assets.cjs electron/release release-assets $env:RELEASE_TAG $env:SOURCE_SHA

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Checkout FIRST. actions/checkout runs `git clean -ffdx` in the workspace,
      # which deletes any untracked directory — so a checkout placed after the
      # artefacts were staged silently removed them, and the publish step then
      # reported that its glob matched nothing. It cost two runs to find, because
      # the log showed the files present at the end of the step that created them
      # and absent at the point of use, with nothing in between but a checkout.
      - uses: actions/checkout@v4
        with:
          # At the tag, not at the branch, so body_path resolves against the tree
          # that is actually being published.
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
      - name: Verify the release tag still points to the built commit
        env:
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          actual=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$actual" = "$SOURCE_SHA"

      # Downloaded into a directory named differently from the artifact, because
      # upload-artifact can preserve the source directory name inside the archive
      # and the result lands one level deeper than the name suggests. The step
      # below flattens whatever arrived rather than assuming a depth.
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Normalise and verify the artefacts
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find assets -type f \( -name '*.exe' -o -name '*.blockmap' -o -name '*.yml' -o -name '*.txt' \) \
            -exec mv -f {} release-assets/ \;

          echo "--- collected ---"
          ls -la release-assets/

          # A release published with no installer is worse than no release: the
          # download link resolves and delivers nothing. This ran once already —
          # the publish step reported success while matching zero files, because
          # the glob quietly matched nothing.
          if ! ls release-assets/*.exe >/dev/null 2>&1; then
            echo "::error::No .exe installer found in the artefact. Refusing to publish an empty release."
            exit 1
          fi
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          grep -Fx "tag=$RELEASE_TAG" release-assets/build-source.txt
          grep -Fx "commit=$SOURCE_SHA" release-assets/build-source.txt
          channel=$(sed -n 's/^channel=//p' release-assets/build-source.txt)
          test -n "$channel"
          test -f "release-assets/$channel.yml"
          test -f release-assets/latest.yml

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          # `create` refuses an existing release rather than replacing its assets.
          # Keep the release hidden until every upload and asset name is verified.
          options=(--draft --verify-tag --target "$SOURCE_SHA")
          visibility=(--draft=false)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
            visibility+=(--latest=false)
          else
            visibility+=(--latest=true)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            "${options[@]}" --title "Aqvenor $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > published-assets.txt
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          diff -u expected-assets.txt published-assets.txt
          # Re-read the remote immediately before making the release visible.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          gh release edit "$RELEASE_TAG" "${visibility[@]}"
